<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harvest — Your week</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#33502F" />
<style>
  .stub {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 4rem;
    gap: 1rem;
  }
  .stub h1 { font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -0.02em; }
  .stub p { color: var(--ink-soft); max-width: 32rem; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html">
      <svg class="wordmark-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 20C4 12 9 5 20 4C19 15 12 20 4 20Z" fill="#33502F"/>
        <path d="M5 19C9 15 12 12 18 6" stroke="#EFEAD9" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      Harvest
    </a>
  </header>

  <div class="stub">
    <h1>You're in, <span id="who">friend</span>.</h1>
    <p>This is where the weekly meal board and grocery list will live. For now, this page just confirms sign in worked.</p>
    <button class="btn-primary" id="btn-signout" style="width:auto;">Sign out</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      document.getElementById("who").textContent = user.displayName || user.email;
    });

    document.getElementById("btn-signout").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "index.html";
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch((err) => {
        console.warn("Service worker registration failed:", err);
      });
    }
  </script>
</body>
</html>
